data:
  tables:
    v1: feature_store_monthly
    v2: feature_store_monthly_v2
    v3: features_monthly_v3
  active_table: v3
  compare_tables: []
  rename_columns:
    month: date
  target_column: target_closing_balance_usd
  id_column: user_id
  time_column: date
  drop_columns:
    # The base list every family narrows from, so these leave every model.
    mean:
    # history_id routes users between the three-month average and xgboost; it is never a feature.
    - history_id
    # Segment ids are ordered, so trees split on them as numbers; linear models would read them as equal steps.
    # Top-15 trial: each family keeps only its 15 highest-SHAP features (full config in ml_config.full.yaml).
    ridge_regression:
    - history_id
    - sign_regime_id
    - size_id
    - behaviour_id
    - prev_1m_total_credited_usd
    - prev_1m_total_debited_usd
    - prev_1m_spend_groceries_usd
    - prev_1m_spend_dining_usd
    - prev_1m_spend_retail_usd
    - prev_1m_spend_transport_usd
    - prev_1m_spend_bills_usd
    - prev_1m_spend_other_usd
    - prev_1m_txn_count
    - prev_1m_distinct_merchants
    - accounts_held
    - roll3_std_closing_balance_usd
    - roll3_mean_total_credited_usd
    - roll3_mean_total_debited_usd
    - prev_1m_change
    - roll6_std_net_flow
    - change_volatility_6m
    - flow_volatility_6m
    - eom_cv_6m
    - share_neg_last_6m
    - sign_flips_6m
    - debt_depth_6m
    - income_cv_6m
    - turnover_roll6
    xgboost:
    - history_id
    - prev_1m_closing_balance_usd
    - prev_2m_closing_balance_usd
    - prev_3m_closing_balance_usd
    - prev_1m_net_flow_usd
    - prev_1m_spend_dining_usd
    - prev_1m_spend_cash_atm_usd
    - prev_1m_spend_transport_usd
    - prev_1m_spend_bills_usd
    - prev_1m_spend_other_usd
    - accounts_held
    - roll3_mean_closing_balance_usd
    - roll3_std_closing_balance_usd
    - roll3_mean_total_credited_usd
    - roll6_mean_balance
    - roll6_std_balance
    - net_flow_cv
    - change_volatility_6m
    - flow_volatility_6m
    - eom_cv_6m
    - share_neg_last_6m
    - sign_flips_6m
    - debt_depth_6m
    - drawdown_6m
    - turnover_roll6
    - sign_regime_id
    - size_id
    - behaviour_id
  default_drop_columns: mean
  random_state: 42
split:
  test_share: 0.2
  gap_months: 0
  cv_folds: 5
  cv_test_months: 3
  min_train_months: 6
segments:
  # Smallest category the router will trust; smaller ones are warned about.
  min_rows: 100
  sign_regime:
    # Share of the last 6 months below zero that counts as "always negative".
    negative_share: 0.9
    # Deepest debt, in months of turnover, splitting shallow from deep.
    debt_depth_months: 2.0
  size:
    # Mean monthly credited + |debited| in dollars: [low/mid, mid/high].
    turnover: [5000, 20000]
  behaviour:
    # Net-flow spread / turnover: [stable/moderate, moderate/dynamic].
    flow_volatility: [0.20, 0.50]
    # Rows with fewer months of history are unassigned.
    min_months: 3
  history:
    # Months with a balance in M-6..M-1 needed for xgboost; fewer use the three-month average.
    min_months: 6
features: []
feature_selection:
  model: xgboost
  # RFECV on `model` with Optuna's params, on the same folds, scored by WAPE on
  # the change target. Survivors go to models/<model>_rfecv.json, the CV table and the final fit.
  rfecv:
    # Off for the top-15 trial so RFECV cannot prune below 15.
    enabled: false
    # Features removed per round; raise it if a run takes too long.
    step: 1
    min_features: 1
  # SHAP on the training rows for every model that has features (not the baselines).
  shap:
    enabled: true
    # Bars on <model>_shap.png; <model>_shap.csv keeps every feature the model uses.
    top_n: 15
  # Ridge and elastic net: listed when L1 zeroed nothing, smallest |coef| first.
  linear:
    weakest_n: 10
evaluation:
  # Persistence, not the 3-month average. The 3-month average is the worst
  # predictor in the table (WAPE 22.5, r2_change -4.2), so a skill score
  # measured against it flatters everything: the booster read +0.561 against
  # it and +0.002 against persistence, which is the number that means
  # something. "Last month's balance does not move" is the bar this problem
  # actually has to clear.
  reference_model: persistence
  anchor_column: prev_1m_closing_balance_usd
  mape_floor: 1000.0
  headline_metric: wape
  tier_quantiles:
  - 0.5
  - 0.9
  # Segment id column -> its lookup table. CV WAPE is broken down by each to see
  # where a model beats persistence; an empty block turns the check off.
  segment_columns:
    sign_regime_id: seg_sign_regime
    size_id: seg_size
    behaviour_id: seg_behaviour
  # Folds a model must win in a segment to pass; rows per fold use segments.min_rows.
  segment_min_folds_won: 4
models:
# The reference. n_months: 1 is last month's balance unchanged -- the same
# quantity as the anchor, scored through the ordinary model path so it cannot
# get a scoring shortcut nothing else gets.
- name: persistence
  kind: lag_average
  params:
    n_months: 1
- name: three_month_average
  kind: lag_average
  params:
    n_months: 3
- name: ridge
  kind: ridge
  optuna:
    alpha: {low: 0.01, high: 1000000.0, log: true}
# Ridge plus an L1 penalty; kept beside ridge so the two compare on one table.
# Alpha is in dollars on elastic net's scale, not ridge's (see elastic_net.py).
- name: elastic_net
  kind: elastic_net
  optuna:
    alpha: {low: 0.01, high: 100000.0, log: true}
    # 0 is ridge, already in the table; the solver handles it badly.
    l1_ratio: {low: 0.05, high: 1.0}
- name: xgboost
  kind: xgboost
  optuna:
    # huber_slope is set at fit time to the median |training target|.
    objective: [reg:absoluteerror, reg:pseudohubererror, reg:squarederror]
    # Depth stops at 6: depth 10 memorised.
    max_depth: {low: 3, high: 6}
    n_estimators: {low: 100, high: 600}
    learning_rate: {low: 0.01, high: 0.1, log: true}
    min_child_weight: {low: 5.0, high: 100.0, log: true}
    subsample: {low: 0.6, high: 1.0}
    colsample_bytree: {low: 0.5, high: 1.0}
    reg_lambda: {low: 0.1, high: 50.0, log: true}

optuna:
  enabled: true
  n_trials: 50
  # linear: fold k of n weighs k, so the folds nearest the holdout (and after
  # the 2024-07 shift) count most. equal: all folds the same.
  fold_weights: linear
  # The winner is refitted on these seeds; a lead smaller than their spread
  # is seed noise, not skill.
  seed_check: [1, 2, 3]
  storage: optuna_study.db
output:
  model_dir: models
  feature_table: features_table_two
