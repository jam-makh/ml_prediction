data:
  tables:
    v1: feature_store_monthly
    v2: feature_store_monthly_v2
  # The one table this run trains and scores. Switch between v1 and v2 here.
  active_table: v1
  # Empty: one TRAIN vs TEST table for active_table. Listing tables runs each
  # into models_<table>/ and adds an ACROSS TABLES comparison.
  compare_tables: []
  rename_columns:
    month: date
  target_column: target_closing_balance_usd
  id_column: user_id
  time_column: date
  drop_columns:
    mean: []
    ridge_regression: []
    # Dropped on measurement (2026-09-21, v1, fixed params): removing the 7
    # spend categories moved CV MAE 11,503 -> 11,500 and holdout MAE
    # 21,669 -> 21,674. They carry nothing, so the smaller model is kept.
    xgboost:
    - prev_1m_total_spend_usd
  # Points at the empty list on purpose: the base dataset carries every
  # column, and each model family narrows it with its own list (train.py,
  # FAMILY_BY_KIND). A default that dropped columns would drop them for every
  # family.
  default_drop_columns: mean
  # Share of users dropped as whales, ranked on median |prev_1m_closing_balance_usd|
  # over the TRAINING months only, so the choice cannot read the holdout.
  # Entities, not rows: trimming rows would gap a user's own lag features and
  # would select on the target. 0.0 keeps the full panel.
  #
  # The resulting numbers describe a smaller population and are NOT comparable
  # with full-panel numbers -- the denominator of every percentage error moved.
  trim_top_entities: 0.0
  random_state: 42
split:
  # Last floor(share x months) months are the holdout; src/month_cut.py is the
  # one rule, shared by the pipeline and the Spark feature build.
  test_share: 0.2
  gap_months: 0
  cv_folds: 5
  cv_test_months: 3
  min_train_months: 6
features: []
feature_selection:
  model: xgboost_change
  redundancy_threshold: 0.95
  tolerance: 0.02
  tolerance_metric: r2_change
  min_signal: 0.01
  stability_max_cv: 1.5
  permutation_repeats: 5
evaluation:
  # Persistence, not the 3-month average. The 3-month average is the worst
  # predictor in the table (WAPE 22.5, r2_change -4.2), so a skill score
  # measured against it flatters everything: the booster read +0.561 against
  # it and +0.002 against persistence, which is the number that means
  # something. "Last month's balance does not move" is the bar this problem
  # actually has to clear.
  reference_model: persistence
  anchor_column: prev_1m_closing_balance_usd
  mape_floor: 1000.0
  headline_metric: wape
  tier_quantiles:
  - 0.5
  - 0.9
models:
# The reference. n_months: 1 is last month's balance unchanged -- the same
# quantity as the anchor, scored through the ordinary model path so it cannot
# get a scoring shortcut nothing else gets.
- name: persistence
  kind: lag_average
  params:
    n_months: 1
- name: three_month_average
  kind: lag_average
  params:
    n_months: 3
- name: ridge_change
  kind: ridge
  # Searched by Optuna when optuna.enabled is true; params above stay fixed.
  optuna:
    alpha: {low: 0.01, high: 1000000.0, log: true}
    # Cap on the TRAINING movement only; the holdout keeps every row.
    # Dollars, or qN = that quantile of the training rows' |change|.
    clip: [null, 500000, 1000000, 2000000, q0.99, q0.995]
    # Divide by the month's typical movement (read from balance lags, known at
    # forecast time) so pre- and post-2024-07 months share one axis.
    market_scale: [false, true]
    # Months for a training row's weight to halve; null = equal weights.
    recency_half_life: [null, 6, 12, 24]
- name: xgboost_change
  kind: xgboost
  params:
    # Fallback when optuna.enabled is false. Depth 10 memorised (train MAE
    # 6.5k against persistence's 8.2k, same test error); depth 4 and depth 6
    # scored the same on the holdout.
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.03
    min_child_weight: 20
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 5
  optuna:
    clip: [null, 500000, 1000000, 2000000, q0.99, q0.995]
    market_scale: [false, true]
    recency_half_life: [null, 6, 12, 24]
    # huber_slope is set at fit time to the median |training target|.
    objective: [reg:absoluteerror, reg:pseudohubererror, reg:squarederror]
    # Depth stops at 6: depth 10 memorised.
    max_depth: {low: 3, high: 6}
    n_estimators: {low: 100, high: 600}
    learning_rate: {low: 0.01, high: 0.1, log: true}
    min_child_weight: {low: 5.0, high: 100.0, log: true}
    subsample: {low: 0.6, high: 1.0}
    colsample_bytree: {low: 0.5, high: 1.0}
    reg_lambda: {low: 0.1, high: 50.0, log: true}
# Searches each model's `optuna` block on the training-region CV folds before
# the final fit. The winner is saved to models/<model>_best_params.json and
# every trial to models/optuna_study.db. The holdout is never read by a trial.
optuna:
  enabled: true
  # Kept small on purpose: the signal is tiny, and more trials mean more
  # chances to win the folds by luck.
  n_trials: 50
  # linear: fold k of n weighs k, so the folds nearest the holdout (and after
  # the 2024-07 shift) count most. equal: all folds the same.
  fold_weights: linear
  # The winner is refitted on these seeds; a lead smaller than their spread
  # is seed noise, not skill.
  seed_check: [1, 2, 3]
  storage: optuna_study.db
output:
  model_dir: models
  feature_table: features_table_two
