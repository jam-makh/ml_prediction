# Airflow 3 on LocalExecutor: one image, five services, plus Airflow's own metadata database.
# The business database is NOT here: it is the cleaning-postgres container on the host, port 5434.
#
#   docker compose up --build -d
#   docker compose logs -f airflow_scheduler
#   UI: http://localhost:8080  (login from AIRFLOW_ADMIN_USER / AIRFLOW_ADMIN_PASSWORD in .env)

# Settings shared by every Airflow service, merged in with `<<: *airflow-common`.
x-airflow-common: &airflow-common
  build: .
  image: ml-prediction-airflow
  environment: &airflow-env
    # Tasks run as subprocesses of the scheduler; no Celery workers or Redis needed.
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?set AIRFLOW_DB_USER in .env}:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}@airflow_postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
    # Every component must share this secret, or tokens signed by one are rejected by another.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
    # FAB gives the username/password login created by airflow_init.
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # Tasks report their state to the API server; the hyphenated alias avoids underscores in a URL host.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Business database credentials; the `:?` form fails at startup instead of on the first query.
    POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env (see .env.example)}
    # "localhost" inside a container is the container itself; host.docker.internal is the Windows host.
    POSTGRES_HOST: host.docker.internal
    POSTGRES_PORT: ${POSTGRES_PORT:-5434}
    # Optional overrides of ml_config.yaml's serving.orchestration; empty means "use the config".
    PREDICT_TIMEOUT_MINUTES: ${PREDICT_TIMEOUT_MINUTES:-}
    RETRAIN_SCHEDULE: ${RETRAIN_SCHEDULE:-}
  extra_hosts:
    # Docker Desktop defines host.docker.internal already; this makes native Linux behave the same.
    - "host.docker.internal:host-gateway"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/ml/src:ro
    # config.py finds config/ via parents[2], so it must sit next to src/.
    - ./config:/opt/ml/config:ro
    # Writable: the retraining DAG saves models here and the prediction DAG loads them.
    - ./models:/opt/ml/models
    # Shared so the UI can read logs that tasks write inside the scheduler container.
    - airflow_logs:/opt/airflow/logs
    # Spark's download cache for the Postgres JDBC jar, kept across container recreates.
    - spark_ivy:/home/airflow/.ivy2.5.2
  depends_on: &airflow-depends-on
    airflow_postgres:
      condition: service_healthy

services:
  # Airflow's own metadata database: DAG runs, task states, users. No published port.
  airflow_postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:?set AIRFLOW_DB_USER in .env}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: migrate the metadata schema and create the admin user, then exit.
  airflow_init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:?set AIRFLOW_ADMIN_USER in .env}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}

  # UI and REST API, bound to 127.0.0.1 so only this machine can reach it.
  airflow_apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      default:
        aliases:
          - airflow-apiserver
    depends_on:
      <<: *airflow-depends-on
      airflow_init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Decides what runs when, and runs the tasks itself (LocalExecutor).
  airflow_scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends-on
      airflow_init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Parses dags/*.py into the metadata database; in Airflow 3 the scheduler no longer does this.
  airflow_dag_processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-depends-on
      airflow_init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Manual pipeline, kept for running train/test by hand outside Airflow.
  # Uncomment and run with `docker compose run --rm train` (or test).
  # ---------------------------------------------------------------------------
  # train:
  #   <<: *airflow-common
  #   command: ["python", "-m", "src.train"]
  #   depends_on: []
  #
  # test:
  #   <<: *airflow-common
  #   command: ["python", "-m", "src.test"]
  #   depends_on: []

volumes:
  airflow_db:
  airflow_logs:
  spark_ivy:
