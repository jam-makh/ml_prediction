# This project does not run its own database. The training data lives in a
# PostgreSQL that is already running on the host and published on port 5433;
# the job here only reads a table from it.
#
# That leaves two services, which are the two halves of the pipeline: the
# job that fits and saves the models, and the job that scores what it saved.

services:
  # The production-shaped half of the pipeline: a batch job, not a server.
  # Exploration happens in a local notebook against the same code in src/;
  # this runs the settled version the way a scheduled job would.
  #
  #   docker compose run --rm train
  #
  # `docker-compose` with a hyphen reaches the same plugin on a current Docker
  # and works too; the hyphenless form is the one that stays. The filename this
  # is written in is unrelated to that -- compose finds compose.yaml,
  # compose.yml, docker-compose.yaml and docker-compose.yml alike.
  #
  # --rm because each run is disposable. Everything worth keeping is written
  # to the bind-mounted ./models on the host, not into the container.
  train:
    build: .
    image: ml-prediction-train
    environment:
      # Credentials for the EXISTING database, set in .env. The `:?` form is
      # what makes a missing .env fail loudly: without it compose substitutes
      # an empty string, the container starts, and the run dies several seconds
      # later on a Postgres authentication error that says nothing about the
      # actual cause.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env (see .env.example)}

      # THE IMPORTANT PART. "localhost" inside a container means the container
      # itself, not your machine -- so the notebook's localhost:5433 cannot be
      # reused here. Docker Desktop resolves host.docker.internal to the host,
      # which is where the database is actually listening.
      #
      #   Local notebook  ->  localhost:5433
      #   This container  ->  host.docker.internal:5433
      #
      # Same database, same published port; only the hostname differs. That is
      # why src/config/config.py reads both from the environment instead of
      # hardcoding either one.
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: ${POSTGRES_PORT:-5433}
    extra_hosts:
      # Docker Desktop provides host.docker.internal automatically; this line
      # makes the same compose file work on native Linux, where it is not
      # defined by default.
      - "host.docker.internal:host-gateway"
    volumes:
      # Code is mounted, not baked into the image, so an edit on the host
      # takes effect on the next run with no rebuild. Read-only because the
      # job has no business rewriting its own source or config.
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      # Writable: this is where trained models land, and the whole point is
      # that they outlive the container.
      - ./models:/app/models
    # No `ports`. This is a job that runs and exits, not a service to reach.

  # The other half: score the models `train` saved, on months none of them has
  # seen. A separate service for the same reason it is a separate script -- a
  # job that both fits and reports the headline number can always be edited
  # into one that reports a number it fitted on.
  #
  #   docker compose run --rm test
  #
  # Reads ./models rather than writing it: this service produces a table on
  # stdout and no artefacts. Everything it needs to know about the train/test
  # boundary is inside the saved model files.
  test:
    build: .
    image: ml-prediction-train
    command: ["python", "-m", "src.test"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env (see .env.example)}
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: ${POSTGRES_PORT:-5433}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      # Read-only: scoring must not be able to overwrite the artefact it is
      # scoring.
      - ./models:/app/models:ro
