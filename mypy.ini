; Type checking for src/. Run with:  mypy src
;
; The notebook is not checked -- exploration code is written to be thrown away,
; and type errors there cost nothing. The container job is a different matter:
; a wrong dtype or a None that was not expected surfaces at 3am rather than in
; a cell.
[mypy]
python_version = 3.12
files = src
strict = True
; Explicit is better here than the blanket allow: an untyped def in src/ is a
; gap in exactly the code the scheduled run depends on.
disallow_untyped_defs = True
warn_unused_ignores = True
warn_return_any = False
pretty = True
; The pydantic plugin teaches mypy the signature of each model's generated
; __init__. Without it every BaseModel constructor call is unchecked.
plugins = pydantic.mypy

; scikit-learn and SQLAlchemy's pandas bridge ship no type information, so
; anything crossing that boundary is Any. Flagged per module rather than
; globally, so a genuinely missing import is still an error.
[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-joblib.*]
ignore_missing_imports = True

[mypy-psycopg2.*]
ignore_missing_imports = True
